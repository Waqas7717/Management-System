<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FG Campus: School and College Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#14284B;--pri2:#223F75;--gold:#D9A21B;--goldink:#3A2A00;--bg:#EEF2F8;--sf:#FFFFFF;--sf2:#F4F7FC;--ink:#16213A;--mut:#5D6B85;--ln:#DCE3EF;
  --ok:#1F8A55;--okbg:#DFF3E8;--bad:#C0392B;--badbg:#FBE4E1;--warn:#8F6200;--warnbg:#FCEFC8;--info:#2F6FED;--infobg:#E3ECFD;
  --btn:#14284B;--btnink:#FFFFFF;--side:#14284B;--sideink:#FFFFFF;--shadow:0 1px 2px rgba(20,40,75,.06),0 4px 14px rgba(20,40,75,.06);
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pri:#9DBBFF;--pri2:#7FA3F5;--gold:#F0BC45;--goldink:#2A1E00;--bg:#0B1322;--sf:#131E35;--sf2:#18253F;--ink:#E6ECF8;--mut:#93A2BE;--ln:#25334F;
    --ok:#4CC58A;--okbg:#14352A;--bad:#F07A6D;--badbg:#3C201E;--warn:#F0BC45;--warnbg:#3A3015;--info:#7FA3F5;--infobg:#1A2B52;
    --btn:#7FA3F5;--btnink:#0B1322;--side:#0A1020;--sideink:#E6ECF8;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --pri:#9DBBFF;--pri2:#7FA3F5;--gold:#F0BC45;--goldink:#2A1E00;--bg:#0B1322;--sf:#131E35;--sf2:#18253F;--ink:#E6ECF8;--mut:#93A2BE;--ln:#25334F;
  --ok:#4CC58A;--okbg:#14352A;--bad:#F07A6D;--badbg:#3C201E;--warn:#F0BC45;--warnbg:#3A3015;--info:#7FA3F5;--infobg:#1A2B52;
  --btn:#7FA3F5;--btnink:#0B1322;--side:#0A1020;--sideink:#E6ECF8;--shadow:none;color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
h1,h2,h3,h4{font-family:Merriweather,Georgia,serif;margin:0;line-height:1.25;color:var(--ink)}
h1{font-size:clamp(21px,4.5vw,28px)}h2{font-size:18px}h3{font-size:16px}h4{font-size:14px}
p{margin:0}
small,.mut{color:var(--mut)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ic{flex:none}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px 14px;background:linear-gradient(160deg,var(--pri) 0%,var(--pri2) 100%)}
:root[data-theme="dark"] .login,:root:not([data-theme="light"]) .login{background:linear-gradient(160deg,#0A1020,#12234A)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .login{background:linear-gradient(160deg,#14284B,#223F75)}}
.lbox{width:100%;max-width:440px;background:var(--sf);border-radius:20px;padding:24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.crest{width:48px;height:48px;border-radius:14px;background:var(--gold);color:var(--goldink);display:grid;place-items:center;font:900 20px Merriweather,serif}
.logo b{font:900 20px Merriweather,serif;display:block;color:var(--ink)}
.logo small{display:block}
.urdu{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",system-ui,serif;direction:rtl}
.rtabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--sf2);padding:4px;border-radius:12px;margin-bottom:14px}
.rtabs button{border:0;background:transparent;padding:10px 4px;border-radius:9px;font-weight:700;color:var(--mut)}
.rtabs button[aria-pressed="true"]{background:var(--btn);color:var(--btnink)}
.demo{margin-top:16px;background:var(--sf2);border:1px dashed var(--ln);border-radius:12px;padding:12px 14px;font-size:13.5px}
.demo code{background:var(--infobg);color:var(--info);padding:1px 6px;border-radius:6px;font-weight:700}

/* forms */
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=search],input[type=time],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);min-height:44px}
textarea{min-height:88px;resize:vertical}
input[type=file]{width:100%;padding:8px;border:1.5px dashed var(--ln);border-radius:10px;background:var(--sf2)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--pri);flex:none}
.chk{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;margin:0;font-weight:600;color:var(--ink);font-size:14px}
.chks{display:grid;gap:6px;max-height:240px;overflow:auto;padding:2px}
.chks.cols{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.two.eq{grid-template-columns:1fr 1fr}}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px;font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--btnink);border:0;border-radius:11px;padding:11px 18px;font-weight:700;min-height:44px}
.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.gold{background:var(--gold);color:var(--goldink)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:active{transform:translateY(1px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}

/* shell */
.app{min-height:100vh}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:58px}
.top .ttl{font:700 16px Merriweather,serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;color:var(--ink)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.view{padding:16px 14px 100px;max-width:1120px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.head p{color:var(--mut);margin-top:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:12}
.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:11.5px;font-weight:700;color:var(--mut);min-height:52px}
.tabs button[aria-current="page"]{color:var(--pri);background:var(--infobg)}
.sheet{position:fixed;inset:0;background:rgba(10,16,32,.55);z-index:30;display:flex;align-items:flex-end}
.sheet>div{background:var(--sf);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.sheet button.nv{display:flex;align-items:center;gap:12px;border:0;background:var(--sf2);padding:13px 14px;border-radius:12px;font-weight:700;text-align:left}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:250px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:18px;background:var(--side);color:var(--sideink);padding:20px 14px;position:sticky;top:0;height:100vh;align-self:start}
  .tabs{display:none}.view{padding:26px 30px 50px}.top .ttl{display:none}.top{justify-content:flex-end}
}
.side .logo b,.side .logo small{color:var(--sideink)}
.side .logo{margin:0}
.side .me{background:rgba(255,255,255,.09);border-radius:12px;padding:10px 12px;font-size:13.5px}
.side .me b{display:block;font-size:14.5px}
.side nav{display:grid;gap:3px}
.side nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:inherit;padding:11px 12px;border-radius:10px;font-weight:700;text-align:left}
.side nav button:hover{background:rgba(255,255,255,.1)}
.side nav button[aria-current="page"]{background:rgba(255,255,255,.16);box-shadow:inset 3px 0 0 var(--gold)}
.side .foot{margin-top:auto;font-size:12px;opacity:.75}

/* cards and bits */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card>h3,.card>h2{margin-bottom:12px}
.card+.card{margin-top:14px}
.stack{display:grid;gap:14px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border-top:4px solid var(--gold)}
.kpi .v{font:900 28px Merriweather,serif;color:var(--ink)}
.kpi .l{color:var(--mut);font-size:13.5px}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--sf2);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.info{background:var(--infobg);color:var(--info)}
.chip.gold{background:var(--gold);color:var(--goldink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--ln);background:var(--sf);border-radius:99px;padding:7px 14px;font-weight:700;color:var(--mut);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btnink)}
.seg small{opacity:.8;margin-left:4px;color:inherit}
.empty{text-align:center;padding:28px 14px;color:var(--mut);border:1.5px dashed var(--ln);border-radius:16px;background:var(--sf)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.item{display:grid;gap:6px;padding:14px;border:1px solid var(--ln);border-radius:14px;background:var(--sf)}
.item+.item{margin-top:10px}
.item.unread{border-left:4px solid var(--gold)}
.item h4{font-family:"Nunito Sans",sans-serif;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{background:var(--sf2);font-size:12.5px;color:var(--mut);font-weight:700}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:160px}
.pill{display:inline-grid;place-items:center;min-width:30px;height:28px;border-radius:8px;font-weight:700;font-size:13px;background:var(--sf2);color:var(--mut)}
.pill.P{background:var(--okbg);color:var(--ok)}.pill.A{background:var(--badbg);color:var(--bad)}.pill.L{background:var(--warnbg);color:var(--warn)}.pill.M{background:var(--infobg);color:var(--info)}
.mark{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
.mark+.mark{margin-top:8px}
.roll{width:30px;height:30px;border-radius:8px;background:var(--sf2);display:grid;place-items:center;font-weight:700;font-size:13px}
.three{display:flex;gap:6px}
.three button{border:1.5px solid var(--ln);background:var(--sf);border-radius:9px;min-width:46px;min-height:42px;font-weight:700;color:var(--mut)}
.three button[aria-pressed="true"].P{background:var(--ok);border-color:var(--ok);color:#fff}
.three button[aria-pressed="true"].A{background:var(--bad);border-color:var(--bad);color:#fff}
.three button[aria-pressed="true"].L{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
@media (max-width:480px){.mark{grid-template-columns:30px minmax(0,1fr)}.three{grid-column:1/-1}.three button{flex:1}}
.bars{display:grid;gap:11px}
.br{display:grid;grid-template-columns:minmax(70px,120px) 1fr 52px;gap:10px;align-items:center;font-size:14px}
.br .bl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:14px;background:var(--sf2);border-radius:8px;overflow:hidden;border:1px solid var(--ln)}
.bf{height:100%;background:var(--pri2);border-radius:8px}
.bf.g{background:var(--ok)}.bf.y{background:var(--gold)}.bf.r{background:var(--bad)}
:root[data-theme="dark"] .bf{background:var(--pri2)}
.bn{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px}
.dn{display:flex;align-items:center;gap:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:12px;font-weight:700;color:var(--mut);text-align:center;padding:2px 0}
.cal button,.cal div.c{min-height:46px;border-radius:10px;border:1.5px solid var(--ln);background:var(--sf);display:grid;place-items:center;font-weight:700;font-size:14px;padding:0}
.cal div.c.off{background:transparent;border-color:transparent;color:var(--mut);opacity:.5}
.cal button.P{background:var(--okbg);border-color:var(--okbg);color:var(--ok)}
.cal button.A{background:var(--badbg);border-color:var(--badbg);color:var(--bad)}
.cal button.L{background:var(--warnbg);border-color:var(--warnbg);color:var(--warn)}
.cal button.M{background:var(--infobg);border-color:var(--infobg);color:var(--info)}
.cal button.sel{outline:3px solid var(--gold);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lc{width:100%;height:auto;display:block}
.lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:13px;color:var(--mut)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.pan{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:10px;left:10px;max-width:420px;margin-left:auto;background:var(--sf);border:1px solid var(--ln);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.28);z-index:25;max-height:70vh;overflow:auto}
.pan .ph{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid var(--ln);position:sticky;top:0;background:var(--sf)}
.pan .pi{padding:12px 14px;border-bottom:1px solid var(--ln);display:grid;gap:3px;cursor:pointer;background:transparent;border-left:0;border-right:0;border-top:0;width:100%;text-align:left}
.pan .pi.u{background:var(--infobg)}
.ov{position:fixed;inset:0;background:rgba(10,16,32,.6);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.md{background:var(--sf);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:92vh;overflow:auto}
@media (min-width:700px){.ov{align-items:center}.md{border-radius:20px}}
.md h3{margin-bottom:6px}
.md .row{margin-top:16px;justify-content:flex-end}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translate(-50%,24px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;max-width:92vw;z-index:60;font-weight:700;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (min-width:900px){#toast{bottom:28px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const TODAY='2026-11-09';
const $=id=>document.getElementById(id);
const h=t=>String(t==null?'':t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const R=rng(20261109);
const rint=(a,b)=>a+Math.floor(R()*(b-a+1));
const pad=n=>('0'+n).slice(-2);

/* ---------- dates ---------- */
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DAYN=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const pd=s=>{const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);};
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const addDays=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return iso(d);};
const dow=s=>(pd(s).getDay()+6)%7;
const isSchool=s=>dow(s)<5;
const fd=s=>DAYN[dow(s)]+', '+pd(s).getDate()+' '+MON[pd(s).getMonth()];
const fs=s=>pd(s).getDate()+' '+MON[pd(s).getMonth()];
function range(a,b){const o=[];let d=a;while(d<=b){o.push(d);d=addDays(d,1);}return o;}
const schoolDays=(a,b)=>range(a,b).filter(isSchool);
const HIST=schoolDays('2026-10-01','2026-11-06');
const ALLD=HIST.concat([TODAY]);
const PT=['8:00','8:45','9:30','10:30','11:15'];
const nowHM=()=>{const d=new Date();return pad(d.getHours())+':'+pad(d.getMinutes());};

/* ---------- master data ---------- */
const CLASSES=[
 {id:'9A',name:'Class 9-A',level:'school',ct:'t1',subjects:['math','eng','urdu','phy','bio'],room:'Room 12'},
 {id:'10A',name:'Class 10-A',level:'school',ct:'t2',subjects:['math','eng','urdu','chem','isl'],room:'Room 14'},
 {id:'FSC1',name:'FSc Part 1',level:'college',ct:'t3',subjects:['phy','chem','math','eng','comp'],room:'Block B'}
];
const SUBJ={math:'Mathematics',eng:'English',urdu:'Urdu',phy:'Physics',chem:'Chemistry',bio:'Biology',isl:'Islamiat',comp:'Computer Science'};
const cls=id=>CLASSES.find(c=>c.id===id);
const DB={};
DB.teachers=[
 {id:'t1',name:'Imran Qureshi',phone:'0300-5551201',user:'imran',pass:'teach123',active:true,assign:[['9A','math'],['10A','math']]},
 {id:'t2',name:'Sana Javed',phone:'0301-5551202',user:'sana',pass:'teach123',active:true,assign:[['9A','eng'],['10A','eng'],['FSC1','eng']]},
 {id:'t3',name:'Nadeem Abbasi',phone:'0302-5551203',user:'nadeem',pass:'teach123',active:true,assign:[['9A','phy'],['FSC1','phy']]},
 {id:'t4',name:'Rubina Aslam',phone:'0303-5551204',user:'rubina',pass:'teach123',active:true,assign:[['9A','urdu'],['10A','urdu'],['10A','isl']]},
 {id:'t5',name:'Khalid Mehmood',phone:'0304-5551205',user:'khalid',pass:'teach123',active:true,assign:[['10A','chem'],['FSC1','chem'],['FSC1','math']]},
 {id:'t6',name:'Ayesha Siddiqui',phone:'0305-5551206',user:'ayesha',pass:'teach123',active:true,assign:[['9A','bio'],['FSC1','comp']]}
];

function stuResult(e,s){

  const got=rows.filter(r=>r.m!==null);const tot=got.reduce((a,r)=>a+r.m,0);
  return {rows,tot,n:got.length,pct:got.length?tot/got.length:null,complete:got.length===rows.length,pass:got.length>0&&got.every(r=>r.m>=33)};

function subjAvg(e,sb,cids){

function agg(sids,dates,sub){
  const o={P:0,A:0,L:0};
  sids.forEach(sid=>{const s=stu(sid);dates.forEach(d=>{for(let p=1;p<=5;p++){if(sub&&subjAt(s.cid,d,p)!==sub)continue;const x=effStatus(sid,d,p);if(x)o[x]++;}});});
  o.pct=(o.P+o.A)?o.P/(o.P+o.A)*100:null;return o;
}
function dayStatus(sid,d){
  if(!isSchool(d))return null;const a=[];for(let p=1;p<=5;p++){const x=effStatus(sid,d,p);if(x)a.push(x);}
  if(!a.length)return null;if(a.every(x=>x==='P'))return 'P';if(a.every(x=>x==='A'))return 'A';if(a.every(x=>x==='L'))return 'L';return 'M';
}
function lectures(sid,d){const s=stu(sid);if(!isSchool(d))return [];const o=[];for(let p=1;p<=5;p++){const sb=subjAt(s.cid,d,p);o.push({p,sub:sb,t:teacherFor(s.cid,sb),st:effStatus(sid,d,p)});}return o;}

/* ---------- charts ---------- */
function barRows(items){
  return '<div class="bars">'+items.map(i=>`<div class="br"><span class="bl" title="${h(i.label)}">${h(i.label)}</span><div class="bt"><div class="bf ${i.cls||''}" style="width:${Math.max(0,Math.min(100,i.val||0))}%"></div></div><span class="bn">${i.note!=null?h(i.note):(i.val==null?'-':Math.round(i.val)+'%')}</span></div>`).join('')+'</div>';
}
function donut(p,label,sub){
  const r=42,c=2*Math.PI*r,v=p==null?0:p;
  return `<div class="dn"><svg viewBox="0 0 100 100" width="112" height="112" role="img" aria-label="${h(label)}: ${p==null?'not marked yet':Math.round(p)+' percent'}"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--ln)" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c*v/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="${p==null?14:20}" font-weight="700" fill="var(--ink)">${p==null?'None':Math.round(p)+'%'}</text></svg><div><b>${h(label)}</b><div class="mut">${sub}</div></div></div>`;
}
function lineChart(labels,series,min){
  min=min||0;const W=560,H=230,L=34,B=30,T=10,Rt=14,iw=W-L-Rt,ih=H-T-B,n=labels.length;
  const x=i=>L+(n===1?iw/2:iw*i/(n-1)),y=v=>T+ih*(1-(v-min)/(100-min));
  let g='';
  for(let k=0;k<=4;k++){const v=min+(100-min)*k/4;g+=`<line x1="${L}" x2="${W-Rt}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--ln)"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--mut)">${Math.round(v)}</text>`;}
  labels.forEach((lb,i)=>{g+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mut)">${h(lb)}</text>`;});
  series.forEach(s=>{const pts=s.values.map((v,i)=>v==null?null:[x(i),y(Math.max(min,v))]).filter(Boolean);
    if(pts.length>1)g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
    pts.forEach(p=>{g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${s.color}"/>`;});});
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of ${h(series.map(s=>s.name).join(', '))}">${g}</svg><div class="lg">${series.map(s=>`<span><i style="background:${s.color}"></i>${h(s.name)}</span>`).join('')}</div>`;
}

function markWork(cid,d,p){
  const key=d+'|'+cid+'|'+p;
  if(S.workKey!==key){S.workKey=key;S.work={};DB.students.filter(s=>s.cid===cid&&s.active).forEach(s=>{const e=effStatus(s.id,d,p);if(e)S.work[s.id]=e;});}
  DB.students.filter(s=>s.cid===cid&&s.active).forEach(s=>{if(DB.leaves.some(l=>l.sid===s.id&&l.status==='approved'&&coversL(l,d,p)))S.work[s.id]='L';});
  return key;
}
VIEWS.teacher.att=()=>{
  const t=S.user;if(!t.assign.length)return head('Attendance')+noAsg();
  const i=Math.min(+F('tasg',0),t.assign.length-1),cid=t.assign[i][0],sub=t.assign[i][1],d=F('tadate',TODAY);
  const sel=`<div class="g2" style="margin-bottom:14px">${asgSel('tasg',i)}${fdate('tadate',d,'Date',TODAY)}</div>`;
  const p=[1,2,3,4,5].find(x=>subjAt(cid,d,x)===sub);
  if(!isSchool(d)||!p)return head('Student attendance','Mark present, absent or leave for each lecture.')+sel+empty('No lecture on this date','Pick a school day (Monday to Friday).');
  const key=markWork(cid,d,p),st=DB.students.filter(s=>s.cid===cid&&s.active);

function attTable(){
  const cid=F('pcls','9A'),mode=F('pmode','daily'),d=F('pdate',TODAY),m=F('pmonth','2026-11'),q=(F('psq','')||'').toLowerCase();
  const dates=mode==='daily'?[d]:ALLD.filter(x=>x.indexOf(m)===0);
  if(cid==='all'){
    return `<div class="tw"><table><thead><tr><th>Class</th><th class="n">Students</th><th class="n">Present</th><th class="n">Absent</th><th class="n">Leave</th><th class="n">Attendance</th></tr></thead><tbody>${CLASSES.map(c=>{const ids=DB.students.filter(s=>s.cid===c.id&&s.active).map(s=>s.id),a=agg(ids,dates);return `<tr><td>${h(c.name)}</td><td class="n">${ids.length}</td><td class="n">${a.P}</td><td class="n">${a.A}</td><td class="n">${a.L}</td><td class="n"><b>${a.pct==null?'Not marked':Math.round(a.pct)+'%'}</b></td></tr>`;}).join('')}</tbody></table></div>`;

  }

}

  if(e.target.classList&&e.target.classList.contains('ov')){closeModal();return;}
  if(S.bell&&!e.target.closest('.pan')&&!e.target.closest('[data-a="bell"]')){S.bell=false;if(!e.target.closest('[data-a]'))render();}
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.classList.contains('sheet')&&e.target!==el)return;
  const f=A[el.dataset.a];if(f)f(el,e);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(!el)return;const f=C[el.dataset.c];if(f)f(el);});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.i&&I[el.dataset.i])I[el.dataset.i](el);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lu'||e.target.id==='lp'))A.login();if(e.key==='Escape'){if($('modal').innerHTML)closeModal();else if(S.bell){S.bell=false;render();}}});
render();
})();
