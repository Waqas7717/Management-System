<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FG Campus: School and College Management</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700;900&family=Nunito+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --pri:#14284B;--pri2:#223F75;--gold:#D9A21B;--goldink:#3A2A00;--bg:#EEF2F8;--sf:#FFFFFF;--sf2:#F4F7FC;--ink:#16213A;--mut:#5D6B85;--ln:#DCE3EF;
  --ok:#1F8A55;--okbg:#DFF3E8;--bad:#C0392B;--badbg:#FBE4E1;--warn:#8F6200;--warnbg:#FCEFC8;--info:#2F6FED;--infobg:#E3ECFD;
  --btn:#14284B;--btnink:#FFFFFF;--side:#14284B;--sideink:#FFFFFF;--shadow:0 1px 2px rgba(20,40,75,.06),0 4px 14px rgba(20,40,75,.06);
  color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --pri:#9DBBFF;--pri2:#7FA3F5;--gold:#F0BC45;--goldink:#2A1E00;--bg:#0B1322;--sf:#131E35;--sf2:#18253F;--ink:#E6ECF8;--mut:#93A2BE;--ln:#25334F;
    --ok:#4CC58A;--okbg:#14352A;--bad:#F07A6D;--badbg:#3C201E;--warn:#F0BC45;--warnbg:#3A3015;--info:#7FA3F5;--infobg:#1A2B52;
    --btn:#7FA3F5;--btnink:#0B1322;--side:#0A1020;--sideink:#E6ECF8;--shadow:none;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --pri:#9DBBFF;--pri2:#7FA3F5;--gold:#F0BC45;--goldink:#2A1E00;--bg:#0B1322;--sf:#131E35;--sf2:#18253F;--ink:#E6ECF8;--mut:#93A2BE;--ln:#25334F;
  --ok:#4CC58A;--okbg:#14352A;--bad:#F07A6D;--badbg:#3C201E;--warn:#F0BC45;--warnbg:#3A3015;--info:#7FA3F5;--infobg:#1A2B52;
  --btn:#7FA3F5;--btnink:#0B1322;--side:#0A1020;--sideink:#E6ECF8;--shadow:none;color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Nunito Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
h1,h2,h3,h4{font-family:Merriweather,Georgia,serif;margin:0;line-height:1.25;color:var(--ink)}
h1{font-size:clamp(21px,4.5vw,28px)}h2{font-size:18px}h3{font-size:16px}h4{font-size:14px}
p{margin:0}
small,.mut{color:var(--mut)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ic{flex:none}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px 14px;background:linear-gradient(160deg,var(--pri) 0%,var(--pri2) 100%)}
:root[data-theme="dark"] .login,:root:not([data-theme="light"]) .login{background:linear-gradient(160deg,#0A1020,#12234A)}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .login{background:linear-gradient(160deg,#14284B,#223F75)}}
.lbox{width:100%;max-width:440px;background:var(--sf);border-radius:20px;padding:24px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.logo{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.crest{width:48px;height:48px;border-radius:14px;background:var(--gold);color:var(--goldink);display:grid;place-items:center;font:900 20px Merriweather,serif}
.logo b{font:900 20px Merriweather,serif;display:block;color:var(--ink)}
.logo small{display:block}
.urdu{font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",system-ui,serif;direction:rtl}
.rtabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--sf2);padding:4px;border-radius:12px;margin-bottom:14px}
.rtabs button{border:0;background:transparent;padding:10px 2px;font-size:13.5px;border-radius:9px;font-weight:700;color:var(--mut)}
.rtabs button[aria-pressed="true"]{background:var(--btn);color:var(--btnink)}

/* login page */
.login{position:relative;overflow:hidden;background:linear-gradient(135deg,#0a2a73 0%,#123a8f 45%,#0b2f7c 100%)!important}
.login .lbg{position:absolute;inset:0;pointer-events:none}
.login .lbg svg{position:absolute;inset:0;width:100%;height:100%}
.login .lphoto{position:absolute;top:0;right:0;bottom:20%;width:min(34vw,520px);background:url(login-building.jpg) center/cover;-webkit-mask-image:linear-gradient(to right,transparent 0,#000 45%),linear-gradient(to bottom,#000 72%,transparent 100%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent 0,#000 45%),linear-gradient(to bottom,#000 72%,transparent 100%);mask-composite:intersect}
@media(max-width:900px){.login .lphoto{opacity:.35;width:60vw}}
.login .lbox{position:relative;z-index:1;max-width:480px;padding:28px 30px 22px;border-radius:26px;box-shadow:0 30px 70px rgba(2,12,45,.45);
  --sf:#fff;--sf2:#EEF2F9;--ink:#0b1f4d;--mut:#4b5a78;--ln:#b9c4dd;--btn:#0b2160;--btnink:#fff;--pri:#0b2160}
.login .logo{gap:16px;margin-bottom:10px}
.login .crest{width:62px;height:62px;border-radius:18px;background:#F7B500;color:#1b1400;font:900 26px Merriweather,serif;box-shadow:0 6px 14px rgba(247,181,0,.35)}
.login .logo b{font:800 31px/1.1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:#0b1f4d;letter-spacing:-.3px}
.login .logo small{font-size:15px;color:#3d4c6d;margin-top:3px}
.ltag{display:flex;align-items:center;justify-content:center;gap:9px;margin:2px 0 18px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:700;color:#3d4c6d}
.ltag i{width:4px;height:4px;border-radius:50%;background:#3d4c6d}
.ltag::before,.ltag::after{content:"";flex:1;height:1px;background:#b9c4dd}
.login .rtabs{grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;border-radius:16px;margin-bottom:12px}
.login .rtabs button{display:flex;align-items:center;justify-content:center;gap:7px;padding:10px 6px;border-radius:13px;font-size:14px;font-weight:700;color:#0b1f4d;min-height:44px}
.login .rtabs button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.login .rtabs button[aria-pressed="true"]{background:#0b1f4d;color:#fff;box-shadow:0 4px 10px rgba(11,31,77,.35)}
@media(max-width:420px){.login .rtabs button span{font-size:12px}.login .rtabs button svg{display:none}}
.login label{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:800;color:#0b1f4d;margin:16px 0 7px}
.login label svg.f{width:17px;height:17px;fill:#0b1f4d;stroke:#0b1f4d;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.login input[type=text],.login input[type=password],.login select{min-height:50px;border:1.5px solid #b9c4dd;border-radius:13px;padding:12px 15px;font-size:15.5px;background:#fff;color:#0b1f4d}
.login input::placeholder{color:#6f7d9b}
.login input:focus,.login select:focus{outline:none;border-color:#123a8f;box-shadow:0 0 0 4px rgba(18,58,143,.15)}
.login .pw{position:relative}.login .pw input{padding-right:50px}
.login .eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:#0b1f4d;cursor:pointer}
.login .eye svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login .btn.block{margin-top:12px;min-height:54px;border-radius:14px;font-size:17px;font-weight:800;background:linear-gradient(180deg,#143483 0%,#0a1f55 100%);box-shadow:0 10px 22px rgba(10,31,85,.35);gap:12px}
.login .btn.block svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.login .btn.sec{background:#fff;color:#0b1f4d;border:1.5px solid #b9c4dd;margin-top:12px}
.login .linfo{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;font-size:13px;color:#3d4c6d}
.login .linfo svg.f{width:17px;height:17px;fill:#3d4c6d;stroke:none;flex:none}
.login .mut{color:#4b5a78}.login .err{margin:8px 0 0;min-height:0}.login .err:empty{display:none}

.demo{margin-top:16px;background:var(--sf2);border:1px dashed var(--ln);border-radius:12px;padding:12px 14px;font-size:13.5px}
.av{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:var(--infobg);color:var(--info);font-weight:700;font-size:12px;overflow:hidden;flex:none;margin-right:10px;vertical-align:middle}
.av.lg{width:52px;height:52px;font-size:20px;margin-right:0}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who{display:inline-flex;align-items:center}\n.item code,.md code{background:var(--infobg);color:var(--info);padding:1px 6px;border-radius:6px;font-weight:700}
.demo code{background:var(--infobg);color:var(--info);padding:1px 6px;border-radius:6px;font-weight:700}

/* forms */
label{display:block;font-size:13px;font-weight:700;color:var(--mut);margin:12px 0 4px}
input[type=text],input[type=password],input[type=date],input[type=number],input[type=search],input[type=time],select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--ln);border-radius:10px;background:var(--sf);color:var(--ink);min-height:44px}
textarea{min-height:88px;resize:vertical}
input[type=file]{width:100%;padding:8px;border:1.5px dashed var(--ln);border-radius:10px;background:var(--sf2)}
input[type=checkbox],input[type=radio]{width:20px;height:20px;accent-color:var(--pri);flex:none}
.chk{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--ln);border-radius:10px;margin:0;font-weight:600;color:var(--ink);font-size:14px}
.chks{display:grid;gap:6px;max-height:240px;overflow:auto;padding:2px}
.chks.cols{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.g3{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.g4{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.two{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.two{grid-template-columns:minmax(0,3fr) minmax(0,2fr)}.two.eq{grid-template-columns:1fr 1fr}}
.err{color:var(--bad);font-size:13px;margin-top:8px;min-height:18px;font-weight:600}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--btn);color:var(--btnink);border:0;border-radius:11px;padding:11px 18px;font-weight:700;min-height:44px}
.btn.sec{background:transparent;color:var(--pri);border:1.5px solid var(--pri)}
.btn.ok{background:var(--ok);color:#fff}
.btn.bad{background:var(--bad);color:#fff}
.btn.gold{background:var(--gold);color:var(--goldink)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:13.5px;border-radius:9px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn:active{transform:translateY(1px)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row.sp{justify-content:space-between}
.grow{flex:1 1 auto;min-width:0}

/* shell */
.app{min-height:100vh}
.side{display:none}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:11;background:var(--sf);border-bottom:1px solid var(--ln);display:flex;align-items:center;gap:8px;padding:8px 14px;min-height:58px}
.top .ttl{font:700 16px Merriweather,serif;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{position:relative;width:44px;height:44px;border-radius:12px;border:1px solid var(--ln);background:var(--sf);display:grid;place-items:center;color:var(--ink)}
.badge{position:absolute;top:-5px;right:-5px;background:var(--bad);color:#fff;font-size:11px;font-weight:700;border-radius:99px;min-width:19px;height:19px;display:grid;place-items:center;padding:0 5px}
.view{padding:16px 14px 100px;max-width:1120px;margin:0 auto}
.head{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:flex-end;margin-bottom:16px}
.head p{color:var(--mut);margin-top:4px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--sf);border-top:1px solid var(--ln);display:grid;grid-auto-flow:column;grid-auto-columns:1fr;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));z-index:12}
.tabs button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;padding:6px 2px;border-radius:10px;font-size:11.5px;font-weight:700;color:var(--mut);min-height:52px}
.tabs button[aria-current="page"]{color:var(--pri);background:var(--infobg)}
.sheet{position:fixed;inset:0;background:rgba(10,16,32,.55);z-index:30;display:flex;align-items:flex-end}
.sheet>div{background:var(--sf);width:100%;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:6px}
.sheet button.nv{display:flex;align-items:center;gap:12px;border:0;background:var(--sf2);padding:13px 14px;border-radius:12px;font-weight:700;text-align:left}
@media (min-width:900px){
  .app{display:grid;grid-template-columns:250px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:18px;background:var(--side);color:var(--sideink);padding:20px 14px;position:sticky;top:0;height:100vh;align-self:start}
  .tabs{display:none}.view{padding:26px 30px 50px}.top .ttl{display:none}.top{justify-content:flex-end}
}
.side .logo b,.side .logo small{color:var(--sideink)}
.side .logo{margin:0}
.side .me{background:rgba(255,255,255,.09);border-radius:12px;padding:10px 12px;font-size:13.5px}
.side .me b{display:block;font-size:14.5px}
.side nav{display:grid;gap:3px}
.side nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:inherit;padding:11px 12px;border-radius:10px;font-weight:700;text-align:left}
.side nav button:hover{background:rgba(255,255,255,.1)}
.side nav button[aria-current="page"]{background:rgba(255,255,255,.16);box-shadow:inset 3px 0 0 var(--gold)}
.side .foot{margin-top:auto;font-size:12px;opacity:.75}

/* cards and bits */
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.card>h3,.card>h2{margin-bottom:12px}
.card+.card{margin-top:14px}
.stack{display:grid;gap:14px}
.kpi{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);border-top:4px solid var(--gold)}
.kpi .v{font:900 28px Merriweather,serif;color:var(--ink)}
.kpi .l{color:var(--mut);font-size:13.5px}
.kpi .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--sf2);color:var(--mut);white-space:nowrap}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.bad{background:var(--badbg);color:var(--bad)}.chip.warn{background:var(--warnbg);color:var(--warn)}.chip.info{background:var(--infobg);color:var(--info)}
.chip.gold{background:var(--gold);color:var(--goldink)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1.5px solid var(--ln);background:var(--sf);border-radius:99px;padding:7px 14px;font-weight:700;color:var(--mut);min-height:38px}
.seg button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btnink)}
.seg small{opacity:.8;margin-left:4px;color:inherit}
.empty{text-align:center;padding:28px 14px;color:var(--mut);border:1.5px dashed var(--ln);border-radius:16px;background:var(--sf)}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
.item{display:grid;gap:6px;padding:14px;border:1px solid var(--ln);border-radius:14px;background:var(--sf)}
.item+.item{margin-top:10px}
.item.unread{border-left:4px solid var(--gold)}
.item h4{font-family:"Nunito Sans",sans-serif;font-size:15px}
.meta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--mut);font-size:13px}
.tw{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:var(--sf)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--ln);white-space:nowrap}
th{background:var(--sf2);font-size:12.5px;color:var(--mut);font-weight:700}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
td.wrap{white-space:normal;min-width:160px}
.pill{display:inline-grid;place-items:center;min-width:30px;height:28px;border-radius:8px;font-weight:700;font-size:13px;background:var(--sf2);color:var(--mut)}
.pill.P{background:var(--okbg);color:var(--ok)}.pill.A{background:var(--badbg);color:var(--bad)}.pill.L{background:var(--warnbg);color:var(--warn)}.pill.M{background:var(--infobg);color:var(--info)}
.mark{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--ln);border-radius:12px;background:var(--sf)}
.mark+.mark{margin-top:8px}
.roll{width:30px;height:30px;border-radius:8px;background:var(--sf2);display:grid;place-items:center;font-weight:700;font-size:13px}
.three{display:flex;gap:6px}
.three button{border:1.5px solid var(--ln);background:var(--sf);border-radius:9px;min-width:46px;min-height:42px;font-weight:700;color:var(--mut)}
.three button[aria-pressed="true"].P{background:var(--ok);border-color:var(--ok);color:#fff}
.three button[aria-pressed="true"].A{background:var(--bad);border-color:var(--bad);color:#fff}
.three button[aria-pressed="true"].L{background:var(--gold);border-color:var(--gold);color:var(--goldink)}
@media (max-width:480px){.mark{grid-template-columns:30px minmax(0,1fr)}.three{grid-column:1/-1}.three button{flex:1}}
.bars{display:grid;gap:11px}
.br{display:grid;grid-template-columns:minmax(70px,120px) 1fr 52px;gap:10px;align-items:center;font-size:14px}
.br .bl{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{height:14px;background:var(--sf2);border-radius:8px;overflow:hidden;border:1px solid var(--ln)}
.bf{height:100%;background:var(--pri2);border-radius:8px}
.bf.g{background:var(--ok)}.bf.y{background:var(--gold)}.bf.r{background:var(--bad)}
:root[data-theme="dark"] .bf{background:var(--pri2)}
.bn{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums;font-size:13px}
.dn{display:flex;align-items:center;gap:14px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .h{font-size:12px;font-weight:700;color:var(--mut);text-align:center;padding:2px 0}
.cal button,.cal div.c{min-height:46px;border-radius:10px;border:1.5px solid var(--ln);background:var(--sf);display:grid;place-items:center;font-weight:700;font-size:14px;padding:0}
.cal div.c.off{background:transparent;border-color:transparent;color:var(--mut);opacity:.5}
.cal button.P{background:var(--okbg);border-color:var(--okbg);color:var(--ok)}
.cal button.A{background:var(--badbg);border-color:var(--badbg);color:var(--bad)}
.cal button.L{background:var(--warnbg);border-color:var(--warnbg);color:var(--warn)}
.cal button.M{background:var(--infobg);border-color:var(--infobg);color:var(--info)}
.cal button.sel{outline:3px solid var(--gold);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.lc{width:100%;height:auto;display:block}
.lg{display:flex;flex-wrap:wrap;gap:12px;margin-top:6px;font-size:13px;color:var(--mut)}
.lg i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px}
.pan{position:fixed;top:calc(env(safe-area-inset-top,0px) + 62px);right:10px;left:10px;max-width:420px;margin-left:auto;background:var(--sf);border:1px solid var(--ln);border-radius:16px;box-shadow:0 14px 40px rgba(0,0,0,.28);z-index:25;max-height:70vh;overflow:auto}

const ico=(n,s)=>`<svg class="ic" width="${s||22}" height="${s||22}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${IC[n]||''}</svg>`;
const cap=s=>s.charAt(0).toUpperCase()+s.slice(1);
const chip=(t,c)=>`<span class="chip ${c||''}">${h(t)}</span>`;
const stChip=st=>st==='P'?chip('Present','ok'):st==='A'?chip('Absent','bad'):st==='L'?chip('Leave','warn'):chip('Not marked','');
const pill=st=>`<span class="pill ${st||''}">${st||'-'}</span>`;
const empty=(t,s)=>`<div class="empty"><b>${h(t)}</b>${s?h(s):''}</div>`;
const head=(t,sub,extra)=>`<div class="head"><div><h1>${h(t)}</h1>${sub?'<p>'+h(sub)+'</p>':''}</div>${extra?'<div class="row">'+extra+'</div>':''}</div>`;
const opts=(list,val)=>list.map(o=>`<option value="${h(o[0])}"${String(o[0])===String(val)?' selected':''}>${h(o[1])}</option>`).join('');
const fsel=(k,list,val,lab)=>(lab?`<label for="f_${k}">${lab}</label>`:'')+`<select id="f_${k}" data-c="f" data-k="${k}">${opts(list,val)}</select>`;
const fdate=(k,val,lab,max)=>`<label for="f_${k}">${lab}</label><input type="date" id="f_${k}" data-c="f" data-k="${k}" value="${val}"${max?' max="'+max+'"':''}>`;
const segBtns=(k,list,val)=>`<div class="seg" role="group">${list.map(o=>`<button data-a="fset" data-k="${k}" data-v="${h(o[0])}" aria-pressed="${String(o[0])===String(val)}">${h(o[1])}</button>`).join('')}</div>`;
const subName=s=>SUBJ[s]||s;
const money=n=>'PKR '+n.toLocaleString('en-US');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove('on'),3000);}
function modal(title,body,actions,cancel){
  $('modal').innerHTML=`<div class="ov"><div class="md" role="dialog" aria-modal="true" aria-label="${h(title)}"><h3>${h(title)}</h3>${body}<div class="err" id="merr"></div><div class="row"><button class="btn sec" data-a="mclose">${h(cancel||'Cancel')}</button>${actions.map(a=>`<button class="btn ${a[2]||''}" data-a="${a[1]}" data-id="${h(a[3]||'')}" data-k="${h(a[4]||'')}">${h(a[0])}</button>`).join('')}</div></div></div>`;
}
const closeModal=()=>{$('modal').innerHTML='';};
const merr=t=>{const e=$('merr');if(e)e.textContent=t;};
function ask(msg,yes,fn){S.pending=fn;modal(msg,'',[[yes,'askyes','bad']]);}

/* ---------- charts ---------- */
function barRows(items){
  return '<div class="bars">'+items.map(i=>`<div class="br"><span class="bl" title="${h(i.label)}">${h(i.label)}</span><div class="bt"><div class="bf ${i.cls||''}" style="width:${Math.max(0,Math.min(100,i.val||0))}%"></div></div><span class="bn">${i.note!=null?h(i.note):(i.val==null?'-':Math.round(i.val)+'%')}</span></div>`).join('')+'</div>';
}
function donut(p,label,sub){
  const r=42,c=2*Math.PI*r,v=p==null?0:p;
  return `<div class="dn"><svg viewBox="0 0 100 100" width="112" height="112" role="img" aria-label="${h(label)}: ${p==null?'not marked yet':Math.round(p)+' percent'}"><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--ln)" stroke-width="10"/><circle cx="50" cy="50" r="${r}" fill="none" stroke="var(--ok)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${(c*v/100).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 50 50)"/><text x="50" y="56" text-anchor="middle" font-size="${p==null?14:20}" font-weight="700" fill="var(--ink)">${p==null?'None':Math.round(p)+'%'}</text></svg><div><b>${h(label)}</b><div class="mut">${sub}</div></div></div>`;
}
function lineChart(labels,series,min){
  min=min||0;const W=560,H=230,L=34,B=30,T=10,Rt=14,iw=W-L-Rt,ih=H-T-B,n=labels.length;
  const x=i=>L+(n===1?iw/2:iw*i/(n-1)),y=v=>T+ih*(1-(v-min)/(100-min));
  let g='';
  for(let k=0;k<=4;k++){const v=min+(100-min)*k/4;g+=`<line x1="${L}" x2="${W-Rt}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}" stroke="var(--ln)"/><text x="${L-6}" y="${(y(v)+4).toFixed(1)}" text-anchor="end" font-size="11" fill="var(--mut)">${Math.round(v)}</text>`;}
  labels.forEach((lb,i)=>{g+=`<text x="${x(i).toFixed(1)}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--mut)">${h(lb)}</text>`;});
  series.forEach(s=>{const pts=s.values.map((v,i)=>v==null?null:[x(i),y(Math.max(min,v))]).filter(Boolean);
    if(pts.length>1)g+=`<polyline fill="none" stroke="${s.color}" stroke-width="2.5" stroke-linejoin="round" points="${pts.map(p=>p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ')}"/>`;
    pts.forEach(p=>{g+=`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="4" fill="${s.color}"/>`;});});
  return `<svg class="lc" viewBox="0 0 ${W} ${H}" role="img" aria-label="Line chart of ${h(series.map(s=>s.name).join(', '))}">${g}</svg><div class="lg">${series.map(s=>`<span><i style="background:${s.color}"></i>${h(s.name)}</span>`).join('')}</div>`;
}

function artFor(role,key,title){
  const t=(title||'').toLowerCase();
  if(/dashboard|overview|home/.test(t))return role==='principal'?ARTS.build_s:ARTS.build;
  if(/announcement|notice/.test(t))return ARTS.mega;
  if(/leave|event|timetable|date sheet/.test(t))return ARTS.cal;
  return ARTS.leaf;
}

function markWork(cid,d,p){
  const key=d+'|'+cid+'|'+p;
  if(S.workKey!==key){S.workKey=key;S.work={};DB.students.filter(s=>s.cid===cid&&s.active).forEach(s=>{const e=effStatus(s.id,d,p);if(e)S.work[s.id]=e;});}
  DB.students.filter(s=>s.cid===cid&&s.active).forEach(s=>{if(DB.leaves.some(l=>l.sid===s.id&&l.status==='approved'&&coversL(l,d,p)))S.work[s.id]='L';});
  return key;
}

function attTable(){
  const cid=F('pcls',dc()),mode=F('pmode','daily'),d=F('pdate',TODAY),m=F('pmonth',CM()),q=(F('psq','')||'').toLowerCase();
  const dates=mode==='daily'?[d]:ALLD.filter(x=>x.indexOf(m)===0);
  if(cid==='all'){
    return `<div class="tw"><table><thead><tr><th>Class</th><th class="n">Students</th><th class="n">Present</th><th class="n">Absent</th><th class="n">Leave</th><th class="n">Attendance</th></tr></thead><tbody>${CLASSES.map(c=>{const ids=DB.students.filter(s=>s.cid===c.id&&s.active).map(s=>s.id),a=agg(ids,dates);return `<tr><td>${h(c.name)}</td><td class="n">${ids.length}</td><td class="n">${a.P}</td><td class="n">${a.A}</td><td class="n">${a.L}</td><td class="n"><b>${a.pct==null?'Not marked':Math.round(a.pct)+'%'}</b></td></tr>`;}).join('')}</tbody></table></div>`;
  }
  let st=DB.students.filter(s=>s.cid===cid&&s.active&&(!q||s.name.toLowerCase().indexOf(q)>-1));
  if(!st.length)return empty('No students found','Try a different class or search.');
  if(mode==='daily'){
    if(!isSchool(d))return empty('No school on this day','Pick a weekday.');
    return `<div class="tw"><table><thead><tr><th>Roll</th><th>Student</th>${[1,2,3,4,5].map(p=>`<th title="${h(subName(subjAt(cid,d,p)))}">L${p}<br><small>${h(subName(subjAt(cid,d,p)).slice(0,5))}</small></th>`).join('')}<th class="n">Day</th></tr></thead><tbody>${st.map(s=>{const a=agg([s.id],[d]);return `<tr><td>${s.roll}</td><td><span class="who">${av(s)}${h(s.name)}</span></td>${[1,2,3,4,5].map(p=>`<td>${pill(effStatus(s.id,d,p))}</td>`).join('')}<td class="n"><b>${a.pct==null?(a.L?'Leave':'-'):Math.round(a.pct)+'%'}</b></td></tr>`;}).join('')}</tbody></table></div>`;
  }
  return `<div class="tw"><table><thead><tr><th>Roll</th><th>Student</th><th class="n">Present</th><th class="n">Absent</th><th class="n">Leave</th><th class="n">Attendance</th></tr></thead><tbody>${st.map(s=>{const a=agg([s.id],dates);return `<tr><td>${s.roll}</td><td><span class="who">${av(s)}${h(s.name)}</span></td><td class="n">${a.P}</td><td class="n">${a.A}</td><td class="n">${a.L}</td><td class="n"><b>${a.pct==null?'-':Math.round(a.pct)+'%'}</b></td></tr>`;}).join('')}</tbody></table></div>`;
}

function kpiIcon(l){
  l=l.toLowerCase();
  const m=[[/student/,'cap','b'],[/parent/,'users','g'],[/teacher|class teacher/,'book','o'],[/principal/,'award','p'],[/class|subject/,'cal','p'],[/absent|not in|missing/,'warn','r'],[/leave/,'cal','o'],[/attend|present|marked/,'check','g'],[/homework|pending/,'book','o'],[/paper|exam|date/,'file','b'],[/notice|unread/,'bell','o'],[/total|percent|grade|position|result|average|pass/,'award','p'],[/lecture/,'clock','b']];
  for(const x of m)if(x[0].test(l))return [x[1],KCOL[x[2]]];
  return ['chart',KCOL.b];
}
function decorKpi(){
  document.querySelectorAll('#root .kpi').forEach(k=>{
    if(k.querySelector('.kic'))return;
    const [n,c]=kpiIcon((k.querySelector('.l')||{}).textContent||'');
    k.insertAdjacentHTML('beforeend',`<span class="kic" style="color:${c[0]};background:${c[1]}" aria-hidden="true">${ico(n,20)}</span>`);
  });
}
let GS=[];
function gsFind(q){
  q=q.trim().toLowerCase();if(!q)return [];
  const out=[];
  NAVS[S.role].items.forEach(i=>{if(i[1].toLowerCase().includes(q))out.push({t:i[1],s:'Page',v:i[0],ic:i[2]});});
  const add=(arr,view,label,ic,tab)=>(arr||[]).forEach(o=>{if(out.length<16&&o&&o.name&&o.name.toLowerCase().includes(q))out.push({t:o.name,s:label,v:view,ic,tab,q:o.name});});
  if(S.role==='admin'){add(DB.students,'students','Student','cap');add(DB.parents,'parents','Parent','users');add(DB.teachers,'teachers','Teacher','book');add(DB.principals,'principals','Principal','award');}
  else if(S.role==='principal'){add(DB.teachers,'users','Teacher','book','teachers');add(DB.parents,'users','Parent','users','parents');add(DB.students,'users','Student','cap','students');}
  else if(S.role==='teacher'){const cl=S.user&&S.user.assign?tClasses(S.user):[];add((DB.students||[]).filter(s=>cl.includes(s.cid)),'att','Student','cap');}
  return out;
}
function gsClose(){const p=document.getElementById('gs');if(p)p.remove();}
function gsShow(){
  const inp=document.getElementById('gq');if(!inp)return;
  gsClose();
  const q=inp.value;if(!q.trim())return;
  GS=gsFind(q);
  const r=inp.closest('.srch').getBoundingClientRect();
  const w=Math.max(280,Math.min(420,window.innerWidth-20));
  const left=Math.max(10,Math.min(r.right-w,window.innerWidth-w-10));
  const el=document.createElement('div');el.id='gs';el.className='gs';el.setAttribute('role','listbox');
  el.style.cssText=`top:${Math.round(r.bottom+8)}px;left:${Math.round(left)}px;width:${w}px`;
  el.innerHTML=GS.length?GS.map((x,i)=>`<button type="button" role="option" data-gs="${i}">${ico(x.ic||'search',18)}<span>${h(x.t)}</span><small>${h(x.s)}</small></button>`).join(''):'<div class="none">No match found.</div>';
  document.body.appendChild(el);
}
function gsPick(i){
  const x=GS[i];if(!x)return;
  gsClose();const s=document.getElementById('srch');if(s)s.classList.remove('open');
  S.view=x.v;S.bell=false;S.more=false;S.f.uq='';S.f.psq='';
  if(x.tab)S.f.utab=x.tab;
  if(x.q){if(S.role==='teacher')S.f.psq=x.q;else S.f.uq=x.q;}
  render();window.scrollTo(0,0);
}

/* ---------- database connection (live mode only) ---------- */
const SYNC={last:{},busy:false,again:false,failed:false,timer:null,poll:null,refreshing:false};
const DICT=['att','tatt','res','pub','hwSub','tt'];
const LISTS=['leaves','tleaves','hw','datesheet','anns','events'];
const sigOf=v=>JSON.stringify(v);
function recMap(c){
  const o={};
  if(DICT.indexOf(c)>-1){const src=DB[c]||{};Object.keys(src).forEach(k=>{const s=sigOf(src[k]);if(s!==undefined)o[k]=s;});}
  else (DB[c]||[]).forEach(it=>{o[it.id]=sigOf(it);});
  return o;
}
async function fetchAll(table,cols,order){
  const out=[];let from=0;
  for(;;){
    let q=sb.from(table).select(cols);
    order.forEach(o=>{q=q.order(o);});
    const r=await q.range(from,from+999);
    if(r.error)throw r.error;
    out.push.apply(out,r.data);
    if(r.data.length<1000)break;
    from+=1000;
  }
  return out;
}
async function loadCore(){
  const all=await Promise.all([
    fetchAll('subjects','code,name',['code']),
    fetchAll('classes','id,name,level,room,class_teacher,subjects',['id']),
    fetchAll('students','id,full_name,roll,class_id,active,photo',['id']),
    fetchAll('parent_students','parent_id,student_id',['parent_id','student_id']),
    fetchAll('teacher_assignments','teacher_id,class_id,subject_code',['class_id','subject_code']),
    fetchAll('profiles','id,username,full_name,phone,role,relation,active,photo',['id'])
  ]);
  const subj=all[0],cl=all[1],st=all[2],ps=all[3],ta=all[4],prof=all[5];
  Object.keys(SUBJ).forEach(k=>{delete SUBJ[k];});subj.forEach(s=>{SUBJ[s.code]=s.name;});
  CLASSES.length=0;cl.forEach(c=>CLASSES.push({id:c.id,name:c.name,level:c.level,ct:c.class_teacher||'',subjects:c.subjects.slice(),room:c.room||''}));
  DB.students=st.map(s=>({id:s.id,name:s.full_name,roll:s.roll,cid:s.class_id,active:s.active,photo:s.photo||''}));
  const kids={},asg={};
  ps.forEach(x=>{(kids[x.parent_id]=kids[x.parent_id]||[]).push(x.student_id);});
  ta.forEach(x=>{(asg[x.teacher_id]=asg[x.teacher_id]||[]).push([x.class_id,x.subject_code]);});
  const base=p=>({id:p.id,name:p.full_name,phone:p.phone||'',user:p.username,active:p.active,photo:p.photo||''});
  DB.teachers=prof.filter(p=>p.role==='teacher').map(p=>Object.assign(base(p),{assign:asg[p.id]||[]}));
  DB.parents=prof.filter(p=>p.role==='parent').map(p=>Object.assign(base(p),{rel:p.relation||'Father',kids:kids[p.id]||[]}));
  DB.principals=prof.filter(p=>p.role==='principal').map(base);
  DB.admins=prof.filter(p=>p.role==='admin').map(base);
  if(S.me){const u=pickUser(S.me.profile);if(u)S.user=u;}
}
async function loadRecords(){
  const rows=await fetchAll('records','collection,id,data',['collection','id']);
  DICT.forEach(c=>{DB[c]={};});LISTS.forEach(c=>{DB[c]=[];});
  rows.forEach(r=>{
    if(DICT.indexOf(r.collection)>-1)DB[r.collection][r.id]=r.data;
    else if(LISTS.indexOf(r.collection)>-1)DB[r.collection].push(r.data);
  });
  LISTS.forEach(c=>DB[c].sort((a,b)=>{const x=a.ts||'',y=b.ts||'';return x<y?1:x>y?-1:0;}));
  SYNC.last={};DICT.concat(LISTS).forEach(c=>{SYNC.last[c]=recMap(c);});
}
async function sync(){
  if(!LIVE||!S.user)return;
  if(SYNC.busy){SYNC.again=true;return;}
  SYNC.busy=true;
  try{
    do{
      SYNC.again=false;
      const cols=DICT.concat(LISTS);
      for(let ci=0;ci<cols.length;ci++){
        const c=cols[ci],cur=recMap(c),last=SYNC.last[c]||(SYNC.last[c]={}),up=[],del=[];
        Object.keys(cur).forEach(id=>{if(last[id]!==cur[id])up.push(id);});
        Object.keys(last).forEach(id=>{if(!(id in cur))del.push(id);});
        for(let i=0;i<up.length;i+=200){
          const chunk=up.slice(i,i+200);
          const rows=chunk.map(id=>({collection:c,id,data:JSON.parse(cur[id]),updated_at:new Date().toISOString()}));
          const r=await sb.from('records').upsert(rows,{onConflict:'collection,id'});
          if(r.error)throw r.error;
          chunk.forEach(id=>{last[id]=cur[id];});
        }
        for(let i=0;i<del.length;i+=100){
          const chunk=del.slice(i,i+100);
          const r=await sb.from('records').delete().eq('collection',c).in('id',chunk);
          if(r.error)throw r.error;
          chunk.forEach(id=>{delete last[id];});
        }
      }
    }while(SYNC.again);
    SYNC.failed=false;
  }catch(e){
    SYNC.failed=true;console.error('Save failed',e);
    if(e&&e.code==='42501'){
      toast('You do not have permission to make that change. It was undone.');
      try{await loadRecords();SYNC.failed=false;paint();}catch(x){}
    }else{
      toast('Could not save to the database. Check your internet. Trying again soon.');
      clearTimeout(SYNC.timer);SYNC.timer=setTimeout(sync,8000);
    }
  }finally{SYNC.busy=false;}
}
function scheduleSync(){if(!LIVE||!S.user)return;clearTimeout(SYNC.timer);SYNC.timer=setTimeout(sync,500);}
async function flushSync(){clearTimeout(SYNC.timer);SYNC.again=false;let n=0;while(SYNC.busy&&n++<50)await new Promise(r=>setTimeout(r,100));await sync();}
function canRepaint(){
  if($('modal').innerHTML)return false;
  const a=document.activeElement;if(a&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName))return false;
  if(Array.prototype.some.call(document.querySelectorAll('#view select[id^="tt_"]'),e=>e.selectedOptions[0]&&!e.selectedOptions[0].defaultSelected))return false;
  return !Array.prototype.some.call(document.querySelectorAll('#view textarea,#view input[type=text],#view input[type=number],#view input[type=date]'),e=>e.value!==e.defaultValue);
}
async function refresh(){
  if(!LIVE||!S.user||document.hidden||SYNC.busy||SYNC.refreshing)return;
  if(iso(new Date())!==TODAY){location.reload();return;}
  SYNC.refreshing=true;
  try{
    await sync();if(SYNC.failed||hasPending())return;
    await loadRecords();await loadCore();
    if(canRepaint())paint();
  }catch(e){console.error('Refresh failed',e);}
  finally{SYNC.refreshing=false;}
}
function hasPending(){
  const cols=DICT.concat(LISTS);
  for(let i=0;i<cols.length;i++){const cur=recMap(cols[i]),last=SYNC.last[cols[i]]||{};
    for(const id in cur)if(last[id]!==cur[id])return true;
    for(const id in last)if(!(id in cur))return true;}
  return false;
}
const startPolling=()=>{stopPolling();SYNC.poll=setInterval(refresh,45000);};
const stopPolling=()=>{if(SYNC.poll){clearInterval(SYNC.poll);SYNC.poll=null;}};

function av(o,cl){
  const n=((o&&o.name)||'').trim(),ini=n.split(/\s+/).slice(0,2).map(w=>w.charAt(0)).join('').toUpperCase();
  return `<span class="av${cl?' '+cl:''}" aria-hidden="true">${o&&o.photo?`<img src="${h(o.photo)}" alt="">`:h(ini)}</span>`;

function readPhoto(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error('Choose an image file (JPG or PNG).'));
    if(file.size>15*1024*1024)return rej(new Error('This image is too large. Choose one under 15 MB.'));
    const r=new FileReader();
    r.onerror=()=>rej(new Error('Could not read the image.'));
    r.onload=()=>{
      const im=new Image();
      im.onerror=()=>rej(new Error('This image could not be opened.'));
      im.onload=()=>{
        const Z=160,cv=document.createElement('canvas');cv.width=cv.height=Z;
        const x=cv.getContext('2d'),m=Math.min(im.width,im.height);
        x.fillStyle='#fff';x.fillRect(0,0,Z,Z);
        x.drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,Z,Z);
        res(cv.toDataURL('image/jpeg',0.72));
      };
      im.src=r.result;
    };
    r.readAsDataURL(file);
  });
}

async function callAdmin(action,payload){
  const ss=await sb.auth.getSession();
  const token=ss.data&&ss.data.session?ss.data.session.access_token:'';
  let res,j=null;
  try{
    res=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify(Object.assign({action},payload))});
    j=await res.json();
  }catch(e){if(!res)throw new Error('Could not reach the server. Check your internet.');}
  if(!res||!res.ok||!j||!j.ok)throw new Error((j&&j.error)||'The server could not finish this ('+(res?res.status:'no reply')+'). Is the /api/admin function deployed?');
  return j;
}

const slug=(s,sep,max)=>String(s).toLowerCase().replace(/[^a-z0-9]+/g,sep).replace(new RegExp('^'+(sep==='.'?'\\.':sep)+'+|'+(sep==='.'?'\\.':sep)+'+$','g'),'').slice(0,max);
function suggestUser(name){
  let base=slug(name,'.',24)||'user';if(base.length<3)base+='.user';let u=base,i=2;
  while(allUsers().some(x=>x.user===u))u=base+(i++);
  return u;
}
function genPass(){
  const L='abcdefghjkmnpqrstuvwxyz',D='23456789',r=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n;};
  let o='';for(let i=0;i<6;i++)o+=L[r(L.length)];for(let i=0;i<4;i++)o+=D[r(D.length)];return o;
}

  if(DEMO){
    const pool=r==='admin'?DB.admins:r==='principal'?DB.principals:r==='teacher'?DB.teachers:DB.parents;
    const m=pool.find(x=>x.user===u&&x.pass===p);
    if(!m)return err('Wrong username or password for the '+r+' login.');
    if(m.active===false)return err('This account is inactive. Please contact the school office.');
    S.user=r==='principal'?Object.assign({},m,{id:'p0'}):m;S.role=r;S.view=NAVS[r].items[0][0];S.f={};S.child=null;S.workKey='';S.bell=false;S.more=false;
    S.reads[S.user.id]=S.reads[S.user.id]||{};render();window.scrollTo(0,0);return;
  }
  const btn=document.querySelector('[data-a="login"]');if(btn)btn.disabled=true;
  try{
    const em=await sb.rpc('login_email',{p_username:u});
    if(em.error)throw em.error;
    if(!em.data)return err('Wrong username or password.');
    const si=await sb.auth.signInWithPassword({email:em.data,password:p});
    if(si.error)return err(/banned/i.test(si.error.message)?'This account is inactive. Please contact the school office.':'Wrong username or password.');
    const res=await enterApp(r);
    if(res!==true){await sb.auth.signOut();resetData();err(res);}
  }catch(e){console.error(e);err('Could not reach the server. Check your internet and try again.');}
  finally{const b=document.querySelector('[data-a="login"]');if(b)b.disabled=false;}
};
A.pwMode=()=>{S.pwMode=!S.pwMode;render();};
A.pwEye=el=>{const i=$('lp');if(!i)return;const show=i.type==='password';i.type=show?'text':'password';el.innerHTML=show?LIC.eye:LIC.eyeoff;};
A.demoLogin=async()=>{
  const r=S.lrole,u=r==='admin'?'':val('du'),err=m=>{const e=$('lerr');if(e)e.textContent=m;};
  const btn=document.querySelector('[data-a="demoLogin"]');if(btn)btn.disabled=true;
  try{
    const res=await fetch('/api/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'login',role:r,username:u})});
    const j=await res.json();
    if(!j.ok||!j.token_hash)return err(j.error||'Could not sign in.');
    const vo=await sb.auth.verifyOtp({token_hash:j.token_hash,type:'magiclink'});
    if(vo.error)return err('Could not sign in. Please try again.');
    const out=await enterApp(r);
    if(out!==true){await sb.auth.signOut();resetData();err(out);}
  }catch(e){console.error(e);err('Could not reach the server. Check your internet and try again.');}
  finally{const b=document.querySelector('[data-a="demoLogin"]');if(b)b.disabled=false;}
};
A.logout=async()=>{
  closeModal();S.bell=false;S.more=false;
  if(LIVE){stopPolling();try{await flushSync();}catch(e){}try{await sb.auth.signOut();}catch(e){}resetData();}
  S.user=null;S.role=null;render();
};
async function init(){
  if(LIVE){
    S.booting=true;render();
    try{
      const dr=await fetch('/api/demo',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action:'list'})});
      const dj=await dr.json();S.demoUsers=dj&&dj.ok&&dj.enabled?dj.users:null;
    }catch(e){S.demoUsers=null;}
    try{
      const ss=await sb.auth.getSession();
      if(ss.data&&ss.data.session){const r=await enterApp();if(r!==true){await sb.auth.signOut();resetData();}}
    }catch(e){console.error(e);}
    S.booting=false;
  }
  render();
}


/* ---------- Admin posting tools: timetable, date sheet, announcements, notices, events and holidays ---------- */

/* Weekly timetable. DB.tt[classId] = {days:[[sub x5] x5]} (Monday to Friday, lectures 1 to 5). */
const TTD=[0,1,2,3,4];
const nextSchool=d=>{let x=d;for(let i=0;i<8&&!isSchool(x);i++)x=addDays(x,1);return x;};
const ttDays=cid=>TTD.map(i=>[1,2,3,4,5].map(p=>ttCell(cid,i,p)));
const ttNote=(cid,title)=>{
  const c=cls(cid);if(!c)return;
  ev({role:'parent',cids:[cid]},title,c.name+' timetable was updated. See the Timetable page.','event');
  DB.teachers.filter(t=>t.assign.some(a=>a[0]===cid)).forEach(t=>ev({role:'teacher',id:t.id},title,c.name+' timetable was updated. See the Timetable page.','event'));
};
const ttHead=()=>`<thead><tr><th>Lecture</th>${TTD.map(i=>`<th${isSchool(TODAY)&&dow(TODAY)===i?' style="color:var(--gold)"':''}>${DAYN[i]}</th>`).join('')}</tr></thead>`;

VIEWS.admin.tt=()=>{
  const ttl='Timetable',sub='Set the weekly timetable for each class. Teachers and parents see it in their own portal.';
  if(!CLASSES.length)return head(ttl,sub)+empty('No classes yet','Add a class under Classes and subjects first.');
  const cid=cls(F('ttc',''))?F('ttc',''):CLASSES[0].id,c=cls(cid),d=ttDays(cid),custom=!!(DB.tt&&DB.tt[cid]);
  return head(ttl,sub)
  +`<div class="g2" style="margin:14px 0">${fsel('ttc',CLASSES.map(x=>[x.id,x.name]),cid,'Class')}</div>`
  +`<div class="card"><div class="row sp" style="margin-bottom:10px"><h3>${h(c.name)}</h3>${custom?chip('Custom timetable','ok'):chip('Default order, not saved yet','warn')}</div>`
  +`<div class="tw"><table>${ttHead()}<tbody>${[1,2,3,4,5].map(p=>`<tr><td>${p} <small>${PT[p-1]}</small></td>${TTD.map(i=>`<td><select id="tt_${i}_${p}" aria-label="${DAYN[i]} lecture ${p}">${c.subjects.map(sb=>`<option value="${h(sb)}"${d[i][p-1]===sb?' selected':''}>${h(subName(sb))}</option>`).join('')}</select></td>`).join('')}</tr>`).join('')}</tbody></table></div>`
  +`<div class="meta" style="margin-top:10px">${c.subjects.map(sb=>{const t=teacherFor(c.id,sb);return chip(subName(sb)+' ('+(t.id?t.name:'no teacher')+')',t.id?'info':'warn');}).join('')}</div>`
  +`<div class="row" style="margin-top:14px"><button class="btn" data-a="ttSave" data-id="${h(cid)}">Save timetable</button>${custom?`<button class="btn sec" data-a="ttReset" data-id="${h(cid)}">Reset to default order</button>`:''}</div></div>`;
};
A.ttSave=el=>{
  const cid=el.dataset.id,c=cls(cid);if(!c)return;
  const days=TTD.map(i=>[1,2,3,4,5].map(p=>{const s=$('tt_'+i+'_'+p);return s&&c.subjects.includes(s.value)?s.value:c.subjects[(p-1+i)%5];}));
  const clashes=[];
  TTD.forEach(i=>[1,2,3,4,5].forEach(p=>{
    const t=teacherFor(cid,days[i][p-1]);if(!t.id)return;
    CLASSES.forEach(o=>{if(o.id===cid||!(DB.tt&&DB.tt[o.id]))return;const s2=ttCell(o.id,i,p);if(teacherFor(o.id,s2).id===t.id)clashes.push(t.name+' is also in '+o.name+' on '+DAYN[i]+', lecture '+p);});
  }));
  const save=()=>{
    DB.tt[cid]={days};
    ttNote(cid,'Timetable updated');
    render();toast('Timetable saved for '+c.name+'. Teachers and parents can see it now.');
  };
  if(clashes.length){
    const more=clashes.length>3?' and '+(clashes.length-3)+' more':'';
    return ask('Teacher clash: '+clashes.slice(0,3).join('; ')+more+'. Save anyway?','Save anyway',()=>{closeModal();save();});
  }
  save();
};
A.ttReset=el=>{
  const cid=el.dataset.id,c=cls(cid);
  ask('Reset the timetable for '+(c?c.name:'this class')+' to the default order?','Reset',()=>{delete DB.tt[cid];ttNote(cid,'Timetable updated');render();toast('Timetable reset.');});
};

function ttView(cid,cell,hl){
  return `<div class="tw"><table>${ttHead()}<tbody>${[1,2,3,4,5].map(p=>`<tr><td>${p} <small>${PT[p-1]}</small></td>${TTD.map(i=>`<td${hl&&dow(TODAY)===i&&isSchool(TODAY)?' style="background:var(--infobg)"':''}>${cell(i,p)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
VIEWS.parent.tt=()=>{
  const k=curKid();if(!k)return noKid();
  const c=cls(k.cid);
  return head('Timetable',c.name+(c.room?', '+c.room:'')+'. Lectures start at '+PT[0]+'.')+kidSwitch()
  +`<div class="card">${ttView(k.cid,(i,p)=>{const sb=ttCell(k.cid,i,p),t=teacherFor(k.cid,sb);return `<b>${h(subName(sb))}</b><br><small>${h(t.id?t.name:'')}</small>`;},true)}</div>`;
};
VIEWS.teacher.tt=()=>{
  const t=S.user;if(!t.assign.length)return head('Timetable')+noAsg();
  const total=TTD.reduce((n,i)=>n+[1,2,3,4,5].filter(p=>t.assign.some(a=>ttCell(a[0],i,p)===a[1])).length,0);
  return head('Timetable','Your lectures in the week: '+total+'.')
  +`<div class="card">${ttView('',(i,p)=>{const m=t.assign.filter(a=>ttCell(a[0],i,p)===a[1]);return m.length?m.map(a=>`<b>${h(cls(a[0]).name)}</b><br><small>${h(subName(a[1]))}</small>`).join('<br>'):'<span class="mut">Free</span>';},true)}</div>`;
};

/* Date sheet (exam papers). Only the Admin posts these. */
VIEWS.admin.ds=()=>{
  const ttl='Date sheet',sub='Exam paper dates for each class. Parents see them in their Date sheet page.';
  if(!CLASSES.length)return head(ttl,sub)+empty('No classes yet','Add a class under Classes and subjects first.');
  const f=F('dsf','all'),list=DB.datesheet.filter(d=>cls(d.cid)&&(f==='all'||d.cid===f)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:0);
  return head(ttl,sub,`<button class="btn" data-a="dsNew">Add paper</button>`)
  +`<div class="g2" style="margin:14px 0"><div>${fsel('dsf',[['all','All classes']].concat(CLASSES.map(x=>[x.id,x.name])),f,'Class')}</div></div>`
  +(list.length?`<div class="tw"><table><thead><tr><th>Class</th><th>Exam</th><th>Subject</th><th>Date</th><th>Time</th><th>Room</th><th></th></tr></thead><tbody>${list.map(d=>`<tr><td>${h(cls(d.cid).name)}</td><td>${h(d.exam||'')}</td><td>${h(subName(d.sub))}</td><td>${fd(d.date)}</td><td>${h(d.time||'')}</td><td>${h(d.room||'')}</td><td><button class="btn sm bad" data-a="dsDel" data-id="${h(d.id)}">Remove</button></td></tr>`).join('')}</tbody></table></div>`:empty('No papers yet','Use Add paper to build the date sheet.'));
};
const dsSubOpts=cid=>{const c=cls(cid);return c?c.subjects.map(sb=>`<option value="${h(sb)}">${h(subName(sb))}</option>`).join(''):'';};
A.dsNew=()=>{
  const c=CLASSES[0];if(!c)return;
  const f=cls(F('dsf',''))?F('dsf',''):c.id,cc=cls(f);
  modal('Add exam paper',
   `<label for="dsa_c">Class</label><select id="dsa_c" data-c="dsaCls">${opts(CLASSES.map(x=>[x.id,x.name]),f)}</select>
    <label for="dsa_e">Exam</label><input type="text" id="dsa_e" value="Monthly Test" placeholder="For example, First Term">
    <label for="dsa_s">Subject</label><select id="dsa_s">${dsSubOpts(f)}</select>
    <div class="g2"><div><label for="dsa_d">Date</label><input type="date" id="dsa_d" value="${addDays(TODAY,7)}" min="${TODAY}"></div><div><label for="dsa_t">Time</label><input type="text" id="dsa_t" value="9:00 am"></div></div>
    <label for="dsa_r">Room</label><input type="text" id="dsa_r" value="${h(cc.room||'')}">
    <div class="err" id="merr"></div>`,
   [['Add paper','dsSave','','']]);
};
C.dsaCls=el=>{$('dsa_s').innerHTML=dsSubOpts(el.value);const c=cls(el.value);if(c)$('dsa_r').value=c.room||'';};
A.dsSave=()=>{
  const cid=val('dsa_c'),sb=val('dsa_s'),d=val('dsa_d'),tm=val('dsa_t'),ex=val('dsa_e');
  if(!cls(cid)||!sb)return merr('Choose a class and subject.');
  if(ex.length<2)return merr('Write the exam name.');
  if(!d)return merr('Choose the date of the paper.');
  if(!isSchool(d))return merr('The paper date must be a weekday.');
  if(!tm)return merr('Enter the time.');
  DB.datesheet.push({id:'d'+uid(),cid,exam:ex,sub:sb,date:d,time:tm,room:val('dsa_r'),by:S.user.id});
  ev({role:'parent',cids:[cid]},'Date sheet updated',subName(sb)+' paper on '+fd(d)+', '+tm+'.','event');
  closeModal();render();toast('Paper added to the date sheet.');
};

/* Announcements and notices: the Admin uses the same screens as the Principal. */
VIEWS.admin.ann=()=>annScreen('announcement');
VIEWS.admin.notice=()=>annScreen('notice');

/* Events and holidays, shown to parents and/or teachers. */
VIEWS.admin.evt=()=>{
  const seen={},list=[];
  DB.events.filter(e=>e.adm).forEach(e=>{if(seen[e.grp])return;seen[e.grp]=1;list.push(e);});
  list.sort((a,b)=>a.ts<b.ts?1:-1);
  const to=g=>['parent','teacher'].filter(r=>DB.events.some(x=>x.grp===g&&x.to.role===r)).map(r=>r==='parent'?'Parents':'Teachers').join(' and ');
  return head('Events and holidays','Holidays, meetings and events. They appear in the notifications of parents and teachers.',`<button class="btn" data-a="evNew">New event or holiday</button>`)
  +(list.length?list.map(e=>`<div class="item"><div class="row sp"><span class="row">${chip(TYPEL[e.type]||'Event',TYPEC[e.type])}${e.date?chip(fd(e.date),'info'):''}</span><small>Posted ${fs(e.ts.slice(0,10))}</small></div><h4>${h(e.title)}</h4><p>${h(e.text)}</p><div class="meta"><span>To ${h(to(e.grp))}</span></div><div class="row"><button class="btn sm bad" data-a="evDel" data-id="${h(e.grp)}">Delete</button></div></div>`).join(''):empty('Nothing posted yet','Use the button above to post a holiday or an event.'));
};
A.evNew=()=>{
  modal('New event or holiday',
   `<label for="ev_t">Title</label><input type="text" id="ev_t" placeholder="For example, Winter holiday">
    <label for="ev_b">Details</label><textarea id="ev_b" placeholder="What should parents and teachers know?"></textarea>
    <div class="g2"><div><label for="ev_type">Type</label><select id="ev_type">${opts([['holiday','Holiday'],['event','Event'],['ptm','PTM'],['urgent','Urgent']],'holiday')}</select></div><div><label for="ev_d">Date (optional)</label><input type="date" id="ev_d" min="${TODAY}"></div></div>
    <label for="ev_a">Send to</label><select id="ev_a">${opts([['both','Parents and teachers'],['parent','Parents only'],['teacher','Teachers only']],'both')}</select>
    <div class="err" id="merr"></div>`,
   [['Post','evSave','','']]);
};
A.evSave=()=>{
  const t=val('ev_t'),b=val('ev_b'),d=val('ev_d'),ty=val('ev_type'),a=val('ev_a');
  if(t.length<3)return merr('Write a title.');if(b.length<5)return merr('Write the details.');
  const grp='g'+uid(),roles=a==='both'?['parent','teacher']:[a],text=(d?fd(d)+'. ':'')+b;
  roles.forEach(r=>DB.events.unshift({id:'ev'+uid(),ts:TODAY+'T'+nowHM(),title:t,text,type:ty,to:{role:r},adm:1,grp,date:d||''}));
  closeModal();render();toast('Posted to '+roles.map(r=>r==='parent'?'parents':'teachers').join(' and ')+'.');
};
A.evDel=el=>{const g=el.dataset.id;ask('Delete this post?','Delete',()=>{DB.events=DB.events.filter(x=>x.grp!==g);render();toast('Deleted.');});};
/* ---------- events ---------- */
document.addEventListener('click',e=>{
  if(e.target.classList&&e.target.classList.contains('ov')){closeModal();return;}
  if(S.bell&&!e.target.closest('.pan')&&!e.target.closest('[data-a="bell"]')){S.bell=false;if(!e.target.closest('[data-a]'))render();}
  const el=e.target.closest('[data-a]');if(!el)return;
  if(el.classList.contains('sheet')&&e.target!==el)return;
  const f=A[el.dataset.a];if(f)f(el,e);
});
document.addEventListener('change',e=>{const el=e.target.closest('[data-c]');if(!el)return;const f=C[el.dataset.c];if(f)f(el);});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset&&el.dataset.i&&I[el.dataset.i])I[el.dataset.i](el);});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.target.id==='lu'||e.target.id==='lp'))A.login();if(e.key==='Escape'){if($('modal').innerHTML)closeModal();else if(S.bell){S.bell=false;render();}}});
init();
})();
</script>
